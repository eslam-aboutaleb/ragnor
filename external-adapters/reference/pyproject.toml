[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnor-reference-adapters"
version = "1.0.0"
description = "Independently authored reference adapters proving Ragnor ports are implementable without editing Ragnor."
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0"
dependencies = ["ragnor"]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
