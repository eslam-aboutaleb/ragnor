name: Extraction benchmarks

# EX-02 quality gates: runs the ground-truth extraction benchmark on the
# synthetic in-repo corpus (no proprietary data, no network, no GPU) and
# compares it against the checked-in baseline thresholds. Heavyweight
# GPU/cloud benchmarks are intentionally out of scope here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pdf-extraction-gates:
    name: PDF extraction gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core with the PDF extra and the test runner
        run: |
          python -m pip install -e '.[pdf]'
          python -m pip install "pytest>=8.3"
      - name: Validate corpus manifest and fixture checksums
        run: python -m benchmarks.pdf_extraction validate
      - name: Run benchmark and enforce baseline gates
        run: >
          python -m benchmarks.pdf_extraction run --provider pypdf
          --baseline benchmarks/pdf_extraction/fixtures/baseline/pypdf.json
      - name: Run deterministic RAG probes
        run: python -m benchmarks.pdf_extraction probes --provider pypdf
      - name: Benchmark unit and regression tests
        run: >
          python -m pytest -q
          tests/test_extraction_benchmark_metrics.py
          tests/test_extraction_benchmark_manifest.py
          tests/test_extraction_benchmark_runner.py
          tests/test_extraction_benchmark_gates.py
          tests/test_extraction_benchmark_probes.py
