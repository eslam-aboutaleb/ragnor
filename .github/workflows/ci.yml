name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit message format
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/commit-messages.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    permissions:
      contents: read
      pull-requests: read

  python:
    name: Shared Python quality
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/python.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: .
      manager: pip
      pip-extras: test
      python-versions: '["3.11", "3.12"]'
      coverage-source: src/ragnor
      coverage-min: 85
      build-distribution: true

  pdf-benchmark-contracts:
    name: PDF benchmark metrics (no corpus download)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline metric test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r benchmarks/requirements.txt pytest pytest-asyncio
      - name: Validate metrics and reject committed benchmark data
        run: |
          python -m pytest -q tests/test_pdf_quality_metrics.py tests/test_benchmark_payload_guard.py tests/test_pdf_qualification.py tests/test_pdf_rag_probes.py
          python scripts/check_benchmark_payloads.py

  pdf-extractor-contracts:
    name: SDK PDF extraction (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host OCR and SDK extras
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python -m pip install -e '.[pdf-auto,directory,database]' pytest pytest-asyncio
      - name: Verify runtime extractors with generated PDFs and real OCR
        run: python -m pytest -q tests/test_sdk_pdf_extractors.py

  architecture-contracts:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install zero-dependency core and test runner
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8.3"
      - name: Enforce inward dependency and plug-in protocol contracts
        run: python -m pytest -q tests/test_architecture_contracts.py tests/test_architecture_all_modules.py

  sdk-consumer:
    name: Installed SDK consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        artifact: ["wheel", "sdist"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --wheel --sdist
      - name: Install and exercise SDK outside checkout
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ragnor-sdk-venv"
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            "$RUNNER_TEMP/ragnor-sdk-venv/bin/python" -m pip install --no-deps dist/ragnor-*.whl
          else
            "$RUNNER_TEMP/ragnor-sdk-venv/bin/python" -m pip install --no-deps dist/ragnor-*.tar.gz
          fi
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ragnor-sdk-venv/bin/python" "$GITHUB_WORKSPACE/examples/sdk_consumer_smoke.py"

  sql-contracts:
    name: SQL database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragnor_contracts
          POSTGRES_USER: ragnor
          POSTGRES_PASSWORD: ragnor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragnor -d ragnor_contracts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      RAGNOR_TEST_DATABASE_URL: postgresql+asyncpg://ragnor:ragnor@localhost:5432/ragnor_contracts
      RAGNOR_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional SQL adapter and test dependencies
        run: |
          python -m pip install -e ".[pgvector]"
          python -m pip install "asyncpg>=0.29" "aiosqlite>=0.20" "pytest>=8.3" "pytest-asyncio>=0.24" "qdrant-client>=1.9"
      - name: Verify host-bound SQLAlchemy storage and real locking
        run: python -m pytest -q tests/integration/test_relational_failure_matrix.py tests/integration/test_relational_process_matrix.py tests/integration/test_relational_outbox_portability.py tests/integration/test_relational_lock_portability.py tests/integration/test_postgres_adapter_contract.py tests/integration/test_postgres_job_outbox.py tests/integration/test_postgres_process_outbox.py tests/integration/test_postgres_publication.py tests/integration/test_postgres_sdk_host.py tests/integration/test_postgres_sql_migrations.py tests/integration/test_qdrant_postgres_publication.py tests/integration/test_postgres_job_policy.py tests/test_hybrid_search_session_injection.py tests/integration/test_postgres_security_lifecycle.py tests/integration/test_sdk_startup_clients.py tests/test_pgvector_strict_mode.py tests/integration/test_qdrant_generation_vectors.py
      - name: Record 1/2/4-worker PostgreSQL and SQLite contention baselines
        run: |
          RAGNOR_CONTRACT_DATABASE_URL="$RAGNOR_TEST_DATABASE_URL" python benchmarks/relational_outbox_profile.py
          RAGNOR_CONTRACT_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/ragnor-profile.db" python benchmarks/relational_outbox_profile.py

  adapter-contracts:
    name: External adapter conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core and test runner
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8.3" "pytest-asyncio>=0.24"
      - name: Verify host adapters and fail-closed contracts
        run: |
          python -m pytest -q tests/test_external_adapter_conformance.py tests/test_extended_adapter_conformance.py

  typing-contracts:
    name: Installed SDK typing contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build typed wheel and inspect distribution artifacts
        run: |
          python -m pip install build twine
          python -m build --wheel --sdist
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as taropen
          from zipfile import ZipFile

          for wheel in Path("dist").glob("*.whl"):
              with ZipFile(wheel) as archive:
                  assert "ragnor/py.typed" in archive.namelist()
          for source in Path("dist").glob("*.tar.gz"):
              with taropen(source) as archive:
                  assert any(name.endswith("/src/ragnor/py.typed") for name in archive.getnames())
          PY
      - name: Type-check installed SDK from outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/ragnor-typing-venv"
          "$RUNNER_TEMP/ragnor-typing-venv/bin/python" -m pip install --no-deps dist/ragnor-*.whl
          "$RUNNER_TEMP/ragnor-typing-venv/bin/python" -m pip install "mypy==1.17.1"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ragnor-typing-venv/bin/python" -m mypy --no-incremental --strict --follow-imports=silent "$GITHUB_WORKSPACE/tests/typing/sdk_consumer.py" "$GITHUB_WORKSPACE/tests/typing/adapter_consumer.py" "$GITHUB_WORKSPACE/tests/typing/legacy_sdk_consumer.py"
      - name: Prove type-checker rejects incompatible SDK API values
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for consumer in invalid_sdk_consumer.py invalid_legacy_sdk_consumer.py; do
            if "$RUNNER_TEMP/ragnor-typing-venv/bin/python" -m mypy --no-incremental --strict --follow-imports=silent "$GITHUB_WORKSPACE/tests/typing/$consumer" > invalid-types.txt 2>&1; then
              echo "::error::mypy unexpectedly accepted wrong SDK argument types in $consumer"
              cat invalid-types.txt
              exit 1
            fi
            grep -q "incompatible type" invalid-types.txt
            grep -q "Document" invalid-types.txt
          done

  tokenizer-contracts:
    name: Optional exact tokenizer contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional tokenizer extra and test dependencies
        run: |
          python -m pip install -e ".[tokenizers-tiktoken]"
          python -m pip install "pytest>=8.3"
      - name: Validate actual encoding-specific token bounds
        run: python -m pytest -q tests/integration/test_tiktoken_adapter.py
      - name: Record multilingual approximation error and chunker performance
        run: python benchmarks/tokenizer_profile.py

  security:
    name: Shared security analysis
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/security.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      languages: '["python", "actions"]'
      config-file: .github/codeql-config.yml

  workflow-validation:
    name: Shared workflow validation
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/workflow-lint.yml@cb10612004f98e6ec10158af72c4d0e1a044e436

  optional-backends:
    name: Optional Backend (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: litellm
            tests: tests/test_embeddings_litellm.py tests/test_embeddings.py tests/integration/test_litellm_transport.py
          - extra: rerank
            tests: tests/test_reranker_integration.py
          - extra: pdf
            tests: tests/test_connectors.py
          - extra: directory
            tests: tests/test_directory_connector.py
          - extra: web
            tests: tests/test_http_connectors.py
          - extra: mcp
            tests: tests/test_mcp_adapter.py tests/test_mcp_stdio.py
          - extra: pgvector
            tests: tests/test_pgvector_store.py tests/test_pgvector_store_coverage.py tests/test_pgvector_strict_mode.py
          - extra: qdrant
            tests: tests/test_vector_backends.py tests/test_qdrant_coverage.py tests/integration/test_qdrant_generation_vectors.py
          - extra: chroma
            tests: tests/test_vector_backends.py
          - extra: faiss
            tests: tests/test_vector_backends.py tests/test_faiss_coverage.py
          - extra: opentelemetry
            tests: tests/test_otel_bridge.py tests/test_telemetry_events.py
          - extra: object-storage
            tests: tests/test_object_connectors.py
          - extra: watch
            tests: tests/test_directory_connector.py
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and backend extras
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,$EXTRA]"

      - name: Run backend tests
        env:
          TEST_PATHS: ${{ matrix.tests }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a test_paths <<< "$TEST_PATHS"
          python -m pytest -q "${test_paths[@]}"

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [commit-messages, python, pdf-benchmark-contracts, pdf-extractor-contracts, architecture-contracts, sdk-consumer, typing-contracts, adapter-contracts, tokenizer-contracts, sql-contracts, security, workflow-validation, optional-backends]
    if: always()
    steps:
      - name: Require every qualification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [f"{name}: {job['result']}" for name, job in results.items() if job["result"] != "success"]
          if failed:
              for message in failed:
                  print(f"::error::{message}")
              raise SystemExit(1)
          print("Shared Python, security, workflow validation, and optional backend checks passed.")
          PYTHON
