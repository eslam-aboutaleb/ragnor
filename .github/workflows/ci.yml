name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Shared Python quality
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/python.yml@57c21925ec0fd1aa1969922136fa7b2594ce6a4e
    with:
      project-dir: .
      manager: pip
      pip-extras: test
      python-versions: '["3.11", "3.12"]'
      coverage-source: src/ragnor
      coverage-min: 85
      build-distribution: true

  security:
    name: Shared security analysis
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/security.yml@57c21925ec0fd1aa1969922136fa7b2594ce6a4e
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      languages: '["python", "actions"]'
      config-file: .github/codeql-config.yml

  workflow-validation:
    name: Shared workflow validation
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/workflow-lint.yml@57c21925ec0fd1aa1969922136fa7b2594ce6a4e

  optional-backends:
    name: Optional Backend (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pgvector
            tests: tests/test_pgvector_store.py tests/test_pgvector_store_coverage.py tests/test_pgvector_strict_mode.py
          - extra: qdrant
            tests: tests/test_vector_backends.py tests/test_qdrant_coverage.py
          - extra: chroma
            tests: tests/test_vector_backends.py
          - extra: faiss
            tests: tests/test_vector_backends.py tests/test_faiss_coverage.py
          - extra: opentelemetry
            tests: tests/test_otel_bridge.py tests/test_telemetry_events.py
          - extra: object-storage
            tests: tests/test_object_connectors.py
          - extra: watch
            tests: tests/test_directory_connector.py
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and backend extras
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,$EXTRA]"

      - name: Run backend tests
        env:
          TEST_PATHS: ${{ matrix.tests }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a test_paths <<< "$TEST_PATHS"
          python -m pytest -q "${test_paths[@]}"

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [python, security, workflow-validation, optional-backends]
    if: always()
    steps:
      - name: Require every qualification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [f"{name}: {job['result']}" for name, job in results.items() if job["result"] != "success"]
          if failed:
              for message in failed:
                  print(f"::error::{message}")
              raise SystemExit(1)
          print("Shared Python, security, workflow validation, and optional backend checks passed.")
          PYTHON
