name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the correct distribution and a release from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'ragnor':
              raise SystemExit('Expected the ragnor distribution')
          if os.environ['EVENT_NAME'] == 'release':
              if os.environ['PRERELEASE'] != 'false':
                  raise SystemExit('Prereleases cannot publish to production PyPI')
              if os.environ['RELEASE_TAG'] != f"v{project['version']}":
                  raise SystemExit('Release tag must match the package version')
              subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          print(f"Validated {project['name']} {project['version']}")
          PY

  qualify:
    name: Qualify release
    needs: verify-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read

  publish:
    name: Publish qualified distribution
    if: github.event_name == 'release'
    needs: [verify-release, qualify]
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/publish-pypi.yml@89daf93d686409ba21c640d6171691c4584caf35
    permissions:
      contents: read
    with:
      project-dir: .
      distribution-name: ragnor
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
