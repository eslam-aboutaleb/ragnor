name: License integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest
      - run: python -m pytest -q tests/test_license_metadata.py
      - run: python -m build
      - run: python scripts/check_distribution_license.py dist/*
      - run: python -m twine check --strict dist/*
      - name: Install core wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/license-consumer"
          "$RUNNER_TEMP/license-consumer/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/license-consumer/bin/python" -c "import ragnor"
