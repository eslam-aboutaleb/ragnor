# SonarQube project configuration for ragnor.
#
# A real SonarQube server scan cannot run in this environment (verified:
# no SONAR_HOST_URL / SONAR_TOKEN env vars, no ~/.sonar, and the
# sonar-scanner CLI cannot be downloaded here). This file exists so a CI
# environment that supplies SONAR_HOST_URL and SONAR_TOKEN can run a real
# scan without further setup. From the repository root, for example:
#
#   sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
#
# Layout: src layout (packages live under src/), tests under tests/.
# The Python analysis backend targets 3.11; ragnor itself is a
# zero-dependency core with optional, separately-installed backends.
sonar.projectKey=eslam-aboutaleb_ragnor
sonar.organization=eslam-aboutaleb
sonar.projectName=ragnor
sonar.projectVersion=0.4.1
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
sonar.exclusions=examples/**,skills/**
sonar.python.coverage.reportPaths=coverage.xml
