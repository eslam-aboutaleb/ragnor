[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnor"
version = "0.4.1"
description = "Domain-agnostic RAG toolkit: embeddings, chunking, vector stores, retrieval, ingestion, evaluation, and jobs."
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/eslam-aboutaleb/ragnor"
Repository = "https://github.com/eslam-aboutaleb/ragnor"
Issues = "https://github.com/eslam-aboutaleb/ragnor/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=7.1,<8",
    "numpy>=1.24",
    "litellm>=1.84",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100,<7",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pypdf>=5,<7",
    "pdfplumber>=0.11.10,<0.12",
    "pypdfium2>=5.14,<6",
    "pillow>=12,<14",
    "pathspec>=0.12,<2",
    "httpx>=0.28,<1",
    "mcp>=1.0.0",
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
]

litellm = [
    "litellm>=1.84",
]
# Reserved for a future local-model embedding backend
# (e.g. sentence-transformers); currently empty.
local-embeddings = []
pgvector = [
    "sqlalchemy[asyncio]>=2.0.30",
]
database = [
    "sqlalchemy[asyncio]>=2.0.30",
]
qdrant = [
    "qdrant-client>=1.9",
]
chroma = [
    "chromadb>=0.5",
]
faiss = [
    "faiss-cpu>=1.8",
]
pdf = ["pypdf>=5,<7"]
pdf-layout = ["pypdf>=5,<7", "pdfplumber>=0.11.10,<0.12"]
pdf-ocr = ["pypdf>=5,<7", "pypdfium2>=5.14,<6", "pillow>=12,<14"]
pdf-auto = ["ragnor[pdf-layout,pdf-ocr]"]
pdf-llm = ["ragnor[pdf-ocr,litellm]"]
directory = ["pathspec>=0.12,<2"]
watch = ["watchfiles>=0.24"]
web = ["httpx>=0.28,<1"]
object-storage = ["boto3>=1.34"]
rerank = ["litellm>=1.84"]
opentelemetry = ["opentelemetry-api>=1.20"]
mcp = ["mcp>=1.0.0"]
tokenizers-tiktoken = ["tiktoken>=0.7,<1"]
all = [
    "ragnor[litellm,pgvector,database,qdrant,chroma,faiss,pdf,pdf-layout,pdf-ocr,pdf-auto,pdf-llm,directory,watch,web,object-storage,rerank,opentelemetry,mcp,tokenizers-tiktoken]",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "SIM", "PL", "RET", "S", "ERA"]
ignore = [
    "S101",
    "PLR2004",
    "RET504",
    "B008",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "PLR2004",
    "E501",
    "PLC0415",
    "SIM105",
    "S110",
    "S105",
    "S108",
    "SIM117",
]
# The pgvector store builds raw SQL with validated identifiers
# (every identifier passes validate_identifier; every value is a
# bound parameter). Same per-file exemption as the backend's
# pre-extraction pgvector_store.py.
"src/ragnor/stores/pgvector.py" = [
    "S608",
]

[tool.setuptools.package-data]
ragnor = ["py.typed", "jobs/adapters/migrations/*.sql"]
